name: Daily signals

on:
  schedule:
    # 23:00 UTC = 6pm ET (weekdays)
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

jobs:
  generate-signals:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily signal pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pipeline.daily_runner

      - name: Upload generated signal artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-signal-output
          path: |
            output/live/
            output/runs/
            output/models/*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Job summary
        run: |
          echo "## Daily signals summary" >> $GITHUB_STEP_SUMMARY
          echo "**Date (UTC):** $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "**Runner:** ${{ runner.os }}" >> $GITHUB_STEP_SUMMARY
