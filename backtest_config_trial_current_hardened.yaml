data:
  provider: yahoo
  cache_ohlcv: true
  cache_dir: data/cache/ohlcv
  cache_ttl_days: 0
feature_selection:
  enabled: true
  method: importance
  n_features: 20
  feature_subset:
  - f_trend
  - ret_5d
  - ret_10d
  - ret_20d
  - rolling_vol_20
  - cs_momentum_percentile
  - rsi_14
  - ret_1d
  - vol_ratio_5_20
model_selection:
  max_positions: 10
  min_positions: 3
  min_windows: 6
  lookahead_horizon_days: 1
  stability_metrics:
    enabled: true
    min_sharpe_mean: 0.0
    max_sharpe_std: 1.6
    min_window_sharpe: -0.5
  hyperparameter_tuning:
    enabled: true
    method: random
    n_trials: 10
    cv: 3
  consensus_features:
    enabled: true
    top_k_per_model_window: 20
    vote_threshold_ratio: 0.5
    weighting: sharpe_weighted
    fallback_min_features: 12
  split_models:
    enabled: false
    long_positive_threshold: 0.0
    short_negative_threshold: 0.0
  validator_gates:
    enabled: true
    min_validation_windows: 2
    min_chained_sharpe: 0.5
    max_drawdown_abs: 0.45
    min_win_rate: 0.5
  promotion:
    require_validator_pass: true
    block_dirty_git_for_production: true
    production_readiness:
      enabled: true
      max_report_age_hours: 36
      require_halt_latch_clear: true
      require_shadow_monitor_pass: true
      require_risk_gate_pass: true
      require_tca_health_pass: true
      require_split_validation_pass: false
  shadow_monitor:
    enabled: true
    lookback_days: 90
    min_score_corr: 0.85
    min_topk_overlap: 0.5
    max_abs_score_delta: 0.25
  split_rollout_gates:
    min_short_pnl_total: 0.0
    min_short_pnl_bear: 0.0
    max_bull_short_damage_abs: 0.0
    max_short_stoploss_rate_bull: 0.5
    min_crisis_sharpe: -0.5
    min_short_trades_bull: 5
    min_crisis_days: 20
    fail_on_insufficient_data: true
backtest:
  start_date: '2013-01-01'
  end_date: '2024-01-01'
  initial_capital: 100000
  max_positions: 10
  max_longs: 5
  max_shorts: 5
  holding_period_days: 7
  min_holding_period_days: 5
  rebalance_every_trading_days: 3
  signal_confidence_multiplier: 1.0
  cross_sectional:
    enabled: false
    market_neutral: false
execution:
  slippage_bps: 5.0
  commission_per_trade: 1.0
  enable_shorts: false
  long_only: true
  regime_suppress_shorts:
  - Bull
  - Sideways
execution_costs:
  enabled: true
  commission_bps: 1.0
  spread_bps: 2.0
  slippage_bps: 2.0
risk:
  max_gross_exposure: 1.5
  max_net_exposure: 0.5
  max_short_single_name: 0.12
  directional_budgets:
    enabled: false
    long_budget: 0.8
    short_budget: 0.4
  short_borrow_cost_bps: 50
  bear_signal_window_days: 60
  bear_signal_quantile: 0.7
  bear_max_holding_days: 3
  bear_regime_intraday_exit_drawdown_pct: 0.02
  bear_skip_new_entries: true
  bear_gross_cap_fraction: 0.5
  bear_liquidate_longs_on_regime_entry: false
  crisis_transition_accel_enabled: true
  crisis_transition_loser_max_hold_days: 0
  crisis_transition_winner_extra_days: 3
  crisis_transition_force_close_losers_same_day: true
  crisis_transition_flatten_all: true
  crisis_transition_use_open_exit: true
  crisis_block_all_new_entries: true
  crisis_risk_mode: cash
  crisis_entry_size_scale: 0.0
  crisis_accelerated_mtm_at_open: false
  crisis_first_day_winner_mtm_at_open: false
  crisis_signal_window_days: 60
  crisis_signal_quantile: 0.95
  position_sizing: equal
  vol_target_annual: 0.12
  vol_lookback_days: 20
  kelly_fraction: 0.5
  kelly_win_rate: 0.55
  kelly_avg_win_return: 0.02
  kelly_avg_loss_return: 0.015
  stop_loss_pct: 0.03
  short_stop_loss_pct: 0.015
  take_profit_pct: 0.0
  max_position_pct_of_equity: 0.12
  max_drawdown_pct: 0.0
  drawdown_resume_pct: 0.0
  min_holding_early_exit_drawdown_pct: 0.03
  var_check:
    enabled: true
    confidence: 0.95
    lookback_days: 60
    max_var_pct: 0.05
    method: historical
    check_target: false
    strict_coverage: false
    min_weight_coverage: 0.002
  hard_limit_gate:
    enabled: true
    fail_closed: true
    max_gross_exposure: 1.5
    max_abs_net_exposure: 0.5
    max_single_name_abs: 0.12
    max_short_single_name_abs: 0.12
    max_sector_exposure: 0.3
risk_factors:
  max_beta: 1.25
  max_sector_exposure: 0.3
  max_single_name_pct: 0.12
  sector_mapping_path: config/sector_mapping.csv
  beta_cache_path: output/beta_cache.csv
  beta_lookback_days: 60
  compute_beta_on_fly: false
  liquidity:
    enabled: true
    max_adv_pct: 0.05
    adv_lookback_days: 20
    adv_cache_path: output/adv_cache.csv
    refresh_cache_on_run: false
mean_variance:
  enabled: false
  method: max_sharpe
  lookback_days: 60
  rebalance_days: 20
  max_single_weight: 0.25
signals:
  min_signal_strength: 0.05
  flip_threshold: 0.02
  signal_confidence_multiplier: 1.0
  signal_confidence_multiplier_bull: 1.0
  signal_confidence_multiplier_sideways: 1.4
  signal_confidence_multiplier_bear: 1.2
  signal_confidence_multiplier_crisis: 2.0
  dynamic_thresholds_enabled: false
  base_signal_threshold: 0.01
  mode: ensemble
  learned_weights_path: output/learned_weights.json
  ml_model_path: output/models/best_model.pkl
  ml_model_type: classifier
  ml_clip: false
  split_models:
    enabled: false
    long_model_path: output/models/best_model_long.pkl
    long_model_type: classifier
    short_model_path: output/models/best_model_short.pkl
    short_model_type: short_classifier
    short_threshold_multiplier_by_regime:
      Bull: 1.5
      Sideways: 1.2
      Bear: 1.0
      Crisis: 2.0
  ensemble:
    models:
    - path: output/models/logisticregression.pkl
      weight: 0.15
      type: classifier
    - path: output/models/xgbclassifier.pkl
      weight: 0.1
      type: classifier
    - path: output/models/ridge.pkl
      weight: 0.2
      type: regressor
    - path: output/models/xgbregressor.pkl
      weight: 0.2
      type: regressor
    - path: output/models/shortlogistic.pkl
      weight: 0.15
      type: short_classifier
    - path: output/models/shortxgb.pkl
      weight: 0.2
      type: short_classifier
    normalize: true
    standardize: true
    clip: false
  weights:
    trend: 1.0
    regional_news: 0.5
    global_news: 0.4
    social: 0.3
factor_neutralization:
  enabled: true
  neutralize_market_beta: true
  neutralize_sector: true
  neutralize_size: true
simulation:
  gbm_enabled: false
monte_carlo:
  enabled: true
  runs: 500
  signal_noise: 0.02
  max_execution_delay_days: 2
regime:
  enabled: true
  threshold_aggressiveness:
    Bull: 1.0
    Bear: 1.0
    Sideways: 1.0
    Crisis: 1.0
  adjustments:
    Bull:
      score_mult: 1.2
      position_scale: 1.0
    Bear:
      score_mult: 0.8
      position_scale: 0.5
    Sideways:
      score_mult: 1.0
      position_scale: 0.7
    Crisis:
      score_mult: 0.6
      position_scale: 0.5
sectors:
  enabled: false
  max_exposure: 0.3
  adjustment_enabled: false
  momentum_weight: 0.1
  volatility_weight: -0.05
  sentiment_weight: 0.1
research:
  walk_forward_enabled: true
  train_years: 3
  test_years: 0.5
  step_years: 0.5
  walk_forward_windows: 4
  walk_forward_train_ratio: 0.7
  walk_forward_train_weights: true
  walk_forward_report_path: output/backtests/walk_forward_validation_report.csv
  ic_decay_lags:
  - 1
  - 5
  - 10
  - 20
output:
  save_trades_csv: true
  save_equity_csv: true
  equity_curve_path: output/backtests/equity_curve.png
  trades_csv_path: output/backtests/trades.csv
  equity_csv_path: output/backtests/daily_equity.csv
  cost_sensitivity_report_path: output/backtests/cost_sensitivity_report.csv
pipeline:
  learned_weights_path: output/learned_weights.json
  retrain_interval_days: 30
  retrain_script: run_retrain_baseline.py
  pipeline_log: output/live/pipeline.log
  strict_preflight_default: true
  fail_if_cache_stale_after_refresh: false
retraining:
  enabled: true
  model_type: learned_weights
  train_start_date: '2018-01-01'
  train_window_years: 5
  schedule: monthly
  run_hour: 0
  run_minute: 0
  output_path: output/learned_weights.json
  scaler_output_path: output/learned_weights_scaler.json
  log_path: output/live/retrain.log
  backup_suffix: .before_retrain
  skip_if_trained_within_days: 0
  validate_with_backtest: true
  validation_holdout_calendar_days: 252
  validation_walk_forward_windows: 3
  accept_if_better_on_windows: 0
  validation_backtest_days: 380
  min_sharpe_ratio_vs_previous: 0.85
  compare_to_last_accepted_mean: false
  min_sharpe_ratio_vs_last_accepted: 0.8
  last_accepted_oos_path: output/retraining_last_accepted_oos.json
  alert_on_failure: true
  release_snapshot_on_success: true
  releases_dir: output/models/releases
live:
  trading_enabled: true
  trading_halt_env: TRADING_HALTED
slippage_tracking:
  enabled: true
  trades_file: output/live/trades.csv
  pending_trades_file: output/live/trades_pending.csv
  signal_price_source: close
  alert_threshold_bps: 10
  rolling_trades: 20
  slippage_metrics_csv: output/live/slippage_metrics.csv
governance:
  preflight:
    run_shadow_monitor: true
    run_shadow_comparison: true
    run_hard_limit_check: true
    run_tca_health_check: true
  dual_model_health:
    enabled: false
    max_artifact_age_hours: 72
    feature_lookback_days: 120
    min_score_std: 0.0001
    min_abs_score_ratio: 0.25
    max_abs_score_ratio: 4.0
  rollout_guard:
    enabled: false
    require_governance_pass: true
    require_split_validation_pass: true
    require_dual_model_health_pass: true
    auto_halt_on_fail: true
    auto_rollback_on_fail: false
    rollback_dry_run: false
    rollback_actor: rollout_guard
    rollback_reason: rollout_guard_gate_breach
  shadow_comparison:
    enabled: true
    min_score_correlation: 0.85
    min_score_sign_agreement: 0.55
    max_score_mae: 0.25
    min_top_k_overlap_mean: 0.5
  slo:
    enabled: true
    output_dir: output/live/slo
    max_summary_age_hours: 36
    allowed_overall_statuses:
    - PASS
    blocked_statuses:
    - BLOCKED
    max_governance_failures: 0
    fail_on_missing_summary: true
    fail_on_invalid_summary: true
  tca_health:
    rolling_trades: 20
    max_avg_slippage_bps: 10.0
    max_p95_slippage_bps: 20.0
    min_fills: 10
    bootstrap_allow_no_data: true
    fail_on_no_data: false
  data_quality:
    enabled: false
    output_dir: output/live/data_quality
    max_age_hours: 36
    fail_on_missing_slo: false
    fail_on_slo_not_pass: false
    strict_null_threshold: 0.05
    drift_threshold: 2.0
    check_schema: true
    check_nulls: true
    check_drift: true
monitoring:
  ic_rolling_window: 20
  sharpe_rolling_window: 20
  ic_alert_threshold: 0.02
  sharpe_alert_threshold: 0.0
  alert_method: print
  email_recipient: your@email.com
  slack_webhook: https://hooks.slack.com/services/...
  dashboard_path: output/live/dashboard.html
  generate_dashboard: true
  monitoring_metrics_path: output/live/monitoring_metrics.csv
