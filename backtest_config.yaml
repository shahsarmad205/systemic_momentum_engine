backtest:
  bootstrap: false
  # ── Continuous optimization mode (forecast-driven, no discrete top-N rebalance) ──
  # Set use_continuous_optimization: true to activate.
  # Leave false to use the existing cross-sectional top-N pipeline.
  use_continuous_optimization: true
  optimization_config:
    forecast:
      tau_days: 6            # Alpha decay constant: 50% decayed at ~4d, ~90% at 14d
      smoothing_span: 5      # EMA span for signal → forecast smoothing
      scale_factor: 0.012    # Vol-normalised score → fractional expected return.
                             # Calibration at mean stock vol=30% (actual large-cap S&P 500):
                             # w*(z=1)=3.3%, w*(z=2)=6.7%, w*(z=3)=10% (capped)
                             # Formula: w* = scale×z / (2λσ²); scale=0.012 at lambda=2, sigma=30%
      use_forecast_demean: true  # Remove CS mean bias (adjusted_score mean≈−0.012) without
                                  # destroying signal magnitude (do NOT divide by std)
      max_alpha: 0.05            # Clip forecasts to ±5% expected return after demeaning
    risk_model:
      window: 60             # Rolling window for covariance estimation (trading days)
      min_periods: 20        # Minimum observations before using estimated cov
      method: ledoit_wolf    # 'ledoit_wolf' (recommended) or 'sample'
    optimizer:
      lambda_risk: 2.0       # Risk aversion: higher → lower gross exposure
      gamma_turnover: 4.0    # Turnover penalty: higher → lower turnover
                             # Calibration: doubling both scale and gamma keeps turnover identical.
                             # scale/gamma ratio preserved → ~340%/yr < 500%/yr target
                             # Position sizes doubled vs scale=0.006/gamma=2.0 baseline
      max_weight: 0.10       # Max absolute weight per position (fraction of portfolio)
      net_exposure_max: 0.3  # Fix 2: cut beta 1.258→~0.35; was 1.0 (unconstrained)
      long_only: false        # Set false to allow shorts (requires enable_shorts: true)
      gross_cap: 0.6         # Fix 4: reduce gross leverage; was 1.0
      min_position_weight: 0.02  # Fix 1: zero out positions <2% → forces concentration,
                                 # eliminates index-hugging from 300-500 tiny positions
    execution:
      horizon_days: 3              # Spread trades over T days (1=immediate, 3=recommended)
      short_close_horizon_days: 2  # Faster exit from shorts — reversal IC decays past day 2-3
      min_trade_weight: 0.001      # Ignore weight changes smaller than 0.1% (avoids micro-trades)
    exposure_scaling:
      enabled: true          # Scale portfolio weights by cross-sectional signal strength
      strength_window: 60    # Rolling history of daily signal strength (days)
      strength_percentile: 75 # Normalize against 75th pct → α_t=1.0 on strong days
      ema_span: 5            # EMA smoothing span for α_t (prevents day-to-day instability)
      min_exposure: 0.1      # Floor: never scale below 10% even on weak-signal days
    factor_model:
      enabled: false         # eta_beta/xi_sector removed: Σ_idio already strips
                             # market+sector variance. Additive penalties on idio
                             # covariance double-count and break λ calibration.
      market_ticker: "SPY"   # Still needed: vol-targeting in MultiAlphaEngine
      sector_mapping_path: "config/sector_mapping.csv"  # Still needed: neutralization
    multi_alpha:
      enabled: true          # Full multi-alpha: Gram-Schmidt orth, Σ⁻¹μ weights, vol-targeting
      # §2 Alpha sources
      # α₁=reversal(τ=2d), α₂=core-ML(τ=7d), α₃=momentum+vol-div(τ=20d)
      reversal_days: 1       # Lookback for short-term reversal
      momentum_days: 20      # Lookback for medium-term momentum
      use_volume_divergence: true  # Blend −corr(ret_1d, volume, 10) into α₃ (Alpha101 paper)
      # §3 CS normalization
      clip_sigma: 3.0        # Hard clip z-scores to ±3σ per alpha
      # §5 Data-driven weights (Σ⁻¹μ from rolling IC)
      weights: [0.2, 0.5, 0.3]   # Fix 5: downweight α₁ reversal (decays 2-3d); was [0.5, 0.25, 0.25]
      ic_window: 60          # Rolling IC history for Σ⁻¹μ computation
      ic_horizon_days: 5     # MUST match holding_period_days. IC calibration horizon:
                             # 1-day IC upweights α₁ reversal (good at 1d, BAD at 5d).
                             # 5-day IC correctly measures which alpha predicts over the
                             # actual holding period — fixes the signal inversion bug.
      weight_ridge: 0.001    # Ridge regularisation on IC covariance matrix
      # §7 Continuous vol-targeting: s_t = clip(target_vol / σ_mkt, lo, hi)
      market_ticker: "SPY"
      target_vol: 0.15       # Annualised portfolio vol target (15%)
      vol_scale_window: 20   # SPY rolling std window (trading days)
      vol_scale_lo: 0.2      # Fix 3: lower floor — allows proper crisis deleveraging; was 0.5
      vol_scale_hi: 1.3      # Fix 3: cap leverage at 1.3× (not 2×); was 2.0
      # §9 Diagnostics (always computed)
      corr_window: 60        # Rolling window for correlation matrix logging
  # BREADTH FIX (Grinold-Kahn Fundamental Law):
  # IR = IC × √N. At IC=0.0274, need N>200 for IR>0.4. Currently N≈32.5.
  # Fix: 18 longs × (252/10d rebalance) × diversity_discount ≈ 80 effective bets/yr.
  # Predicted IR: 0.0274 × √80 = 0.245 (vs 0.156 before). Source: HKUST survey §3.
  max_positions: 25          # 18 longs + 5 shorts + 2 buffer
  cross_sectional:
    enabled: true
    market_neutral: false
    rebalance_daily: false
    target_long_positions: 18
    top_longs: 18            # Grinold-Kahn: raise from 12 to 18 → +50% effective breadth
    top_shorts: 5
    conviction_buffer: 0.0    # z-scored signals make fixed offset meaningless
    short_turnover_gate: true                # Medhat & Schmeling (2022): only short above-median-TO stocks
    information_discreteness_sort: true      # Da et al. (2014) / FIP: prefer continuous-momentum longs over discrete ones
  min_holding_period_days: 3
  # BREADTH FIX: reduce from 15→10 days → 50% more rebalances per year → more independent bets.
  # Turnover will increase ~50% (from ~295% to ~440%) but breadth improvement dominates:
  # More bets at same IC > fewer bets at same IC (Grinold-Kahn). HSBC/Warwick survey §4.
  rebalance_every_trading_days: 5   # Fix 5: match holding_period_days; was 10
  signal_confidence_multiplier: 0.3        # Phase 8: lowered from 1.0 — regressor model std=0.006
  signal_confidence_multiplier_bear: 0.2   # Phase 8: lowered from 0.6
  signal_confidence_multiplier_crisis: 0.2 # Phase 8: lowered from 0.5
  signal_confidence_multiplier_sideways: 0.2 # Phase 8: lowered from 0.5
  start_date: '2008-01-01'   # TRUE OOS evaluation window — model trained on 2007-2022
  end_date: '2022-12-31'    # Full year end for walk-forward windows
  holding_period_days: 5     # Fix 5: match reversal decay (2-3d); was 10
  lookahead_horizon_days: 5  # MUST match holding_period_days; was 10
  dynamic_holding:                         # B2: holding period varies by signal strength
    enabled: true
    by_signal:
      Bullish: 5             # Fix 5: match new holding_period_days; was 10
      Bearish: 4             # Shorts: slightly shorter than longs
    by_strength:             # CS z-score bands for selected stocks (≈1.5–3.5 range)
      - [2.0, 8]             # |z| >= 2.0 → hold 8 days (high conviction); was 15
      - [1.0, 5]             # |z| >= 1.0 → hold 5 days (normal); was 10
data:
  cache_dir: data/cache
  cache_ohlcv: true
  cache_ttl_days: 0
  provider: yahoo
execution:
  commission_per_trade: 1.0
  enable_shorts: true   # Paper signals (RRLP/MS/JLST) require full-universe turnover dispersion; S&P 500 large-caps all have high TO — gate barely filters
  long_only: false
  slippage_bps: 1.0
  # OVEREXTENSION REVERSAL FIX: new short_score_raw = nearness_52w_high × short_term_reversal.
  # This signal is valid in Sideways too (overextended stocks crack in flat markets).
  # Remove Sideways from suppress list — keep Bull and Crisis suppressed only.
  # Source: HKUST survey §3 on L/S alpha: short alpha requires targeted reversal signals, not
  # suppression of entire regimes.
  regime_suppress_shorts: ["Bull", "Crisis"]
execution_costs:
  commission_bps: 1.0
  enabled: true
  scenarios:
  - 1
  sensitivity_test: false
  slippage_bps: 1.0
  spread_bps: 1.0
  # VIX-scaled transaction costs (Hasbrouck 2009 / Almgren-Chriss).
  # slippage_effective = slippage_bps × (1 + alpha × max(0, VIX_t − VIX_252d_median))
  # alpha=0.08: VIX=35 vs median=20 → 2.2× slippage; VIX=80 (GFC) → 5.8× slippage.
  # Automatically self-limits turnover in illiquid markets — no manual regime switch needed.
  vix_cost_scaling_enabled: true
  vix_cost_alpha: 0.08

# Almgren-Chriss square-root market impact model (replaces ad-hoc k_bps * sqrt formula).
# Calibrated for US large-cap equities (Kissell & Malamut 2005 / ITG).
market_impact:
  enabled: true
  eta: 0.142        # temporary impact coefficient
  alpha: 0.314      # permanent impact coefficient
  gamma: 0.6        # participation rate exponent (pure sqrt law = 0.5)
  adv_usd_default: 50000000  # $50M fallback ADV when volume data unavailable

factor_neutralization:
  enabled: true
  neutralize_market_beta: true
  neutralize_sector: true
  neutralize_size: true
  neutralize_smb: false   # B1: FF SMB factor — disabled (ff5_daily.csv not present, returns zeros)
  neutralize_rmw: false   # B1: FF RMW factor — disabled (same reason)
feature_selection:
  feature_subset:
  - f_trend
  - ret_5d
  - ret_10d
  - ret_20d
  # rolling_vol_20 REMOVED: position sizer input, not directional alpha — creates circularity
  # rsi_14 REMOVED: mean-reversion indicator conflicts with momentum signals; dilutes IC
  # ret_1d REMOVED: daily reversal = bid-ask bounce noise, not persistent alpha
  - cs_momentum_percentile
  - vol_ratio_5_20           # vol term structure — regime context only, not pos-sizer input
  - capm_residual_vol
  # All-weather: value, quality, low-vol anomaly, mean-reversion (Jegadeesh 1990, Frazzini & Pedersen 2014, Asness et al. 2019)
  - short_term_reversal
  - nearness_52w_low
  - low_vol_score
  - quality_score
  # Phase A: new alpha factors
  - nearness_52w_high       # George & Hwang 2004: proximity to 52w high predicts continuation
  - capm_alpha              # rolling 60d excess return vs CAPM — pure stock-level alpha
  - momentum_acceleration   # ret_5d - ret_10d: acceleration of momentum signal
  # Phase A: sector-relative momentum (now meaningful with fixed sector mapping)
  - sector_relative_20d     # stock return minus sector median (CS z-scored, lagged 1d)
  - sector_relative_60d     # 60d version — slower sector-relative trend
  - momentum_12m_skip1      # Jegadeesh & Titman 1993 standard: 12M return skip last month; most replicated momentum signal
  # NOTE: idio_momentum_20d REMOVED — collapses to ~0 in Bull/Bear (stocks move with market),
  # giving zero cross-sectional variance → model can't rank → no signal in 75% of trading days
  # NOTE: dist_from_52w_low, liquidity_stress, beta_adj_momentum temporarily removed.
  # Each must be validated individually against the 16-feature baseline before adding back.
  # New features go in only if they improve OOS IC by >0.005 AND don't reduce Sharpe.
  short_feature_subset:
  # --- Medhat & Schmeling (2022, RFS) "Short-term Momentum" ---
  # PRIMARY: turnover-conditioned return. Negative = high-TO loser → momentum continues down.
  # This is the core institutional short signal derived from the paper's double-sort.
  - short_term_momentum_score   # return × turnover_pct_rank (rescaled); negative = short candidate
  - momentum_1m_skip_eom        # EOM-adjusted 1M return (skip last 5 days; Table III: +22% ann vs +16.4%)
  - turnover_pct_rank           # absolute turnover level; high-TO = momentum, low-TO = reversal
  # --- Dai, Medhat, Novy-Marx & Rizova (2023) "Reversals and Returns to Liquidity" ---
  # IRRX signal: reversal stripped of sector momentum (industry momentum) and PEAD noise.
  # t=9.35 vs t=1.68 for raw reversal — far cleaner short signal for non-fundamental winners.
  - industry_relative_reversal  # -(return - sector_return): negative = rose vs sector (reversal SHORT)
  - high_vol_reversal_flag      # 1 if top volatility tercile: reversal completes in 1-2 wks (RRLP Fig.1)
  - rolling_vol_20              # volatility level: higher vol → faster, initially stronger reversal
  # --- Jegadeesh, Luo, Subrahmanyam & Titman (2025, RFS) "Reversals and Momentum around World" ---
  # Reversal and momentum profits are NEGATIVELY correlated across time and countries.
  # Strong 12M momentum stocks → weak reversal signal; weak 12M momentum → strong reversal.
  - momentum_12m_skip1          # Jegadeesh-Titman 12M-1M; inversely related to reversal alpha
  # --- Cross-sectional conditioning ---
  - sector_relative_20d         # sector-relative 20d performance (IRRX decomposition component)
  - cs_momentum_percentile      # cross-sectional percentile rank; bottom decile = short candidate
  - ret_20d                     # raw 20-day return (cross-sectional ranking input)
live:
  trading_enabled: true
  trading_halt_env: TRADING_HALTED
mean_variance:
  enabled: false
  lookback_days: 60
  max_single_weight: 0.25
  method: max_sharpe
  rebalance_days: 20
model_selection:
  ensemble_size: 1   # XGBRegressor only. Ridge has std=1.653 across 5 windows (nearly as high as mean=1.786) — too volatile to blend. XGBRegressor alone: OOS Sharpe 1.312, std=1.189, far more consistent.
  lookahead_horizon_days: 5    # MUST match holding_period_days; was 10
  max_positions: 10
  min_positions: 3
  selection_weight_decay: 0.9
monitoring:
  alert_method: print
  dashboard_path: output/live/dashboard.html
  email_recipient: your@email.com
  generate_dashboard: true
  ic_alert_threshold: 0.02
  ic_rolling_window: 20
  monitoring_metrics_path: output/live/monitoring_metrics.csv
  sharpe_alert_threshold: 0.0
  sharpe_rolling_window: 20
  slack_webhook: https://hooks.slack.com/services/...
monte_carlo:
  enabled: true
  max_execution_delay_days: 2
  runs: 500
  signal_noise: 0.02
output:
  cost_sensitivity_report_path: output/backtests/cost_sensitivity_report.csv
  equity_csv_path: output/backtests/daily_equity.csv
  equity_curve_path: output/backtests/equity_curve.png
  save_equity_csv: true
  save_trades_csv: true
  trades_csv_path: output/backtests/trades.csv
pipeline:
  fail_if_cache_stale_after_refresh: false
  learned_weights_path: output/learned_weights.json
  pipeline_log: output/live/pipeline.log
  retrain_interval_days: 30
  retrain_script: run_retrain_baseline.py
regime:
  confirmation_days: 1   # Phase 13: 1 day — faster Bear/Crisis detection reduces exposure lag
  continuous_score_enabled: true        # D1: use continuous regime score for gross exposure scaling
  score_bull_gross_cap: 1.0             # D1: gross cap fraction at pure Bull (score=0)
  score_crisis_gross_cap: 0.25          # D1: gross cap fraction at pure Crisis (score=1)
  adjustments:
    Bear:
      # PRUDEX benchmark (PhD thesis §7): robustness across market states is a core institutional
      # dimension. Bear win rate was 46.5% (below coin flip) — we should NOT be opening positions
      # aggressively in confirmed Bear. Entry gates now block new longs; only shorts allowed.
      # Reduce position_scale to 0.30 (from 0.45) for any surviving Bear entries.
      # Man Group Bear alpha comes from SHORT momentum, not long — shorts are still allowed.
      position_scale: 0.30
      score_mult: 0.85
    Bull:
      position_scale: 1.0
      score_mult: 1.2
    Cautious:
      # State Street (Ung 2025) "Cautious Decline": equity -0.7%/month, uncertainty high, regime
      # in transition. Man Group: XS Mom hit rate drops during early deterioration phases. Reduce
      # both size and score multiplier to protect capital during the uncertain transition period.
      position_scale: 0.5
      score_mult: 0.85
    Crisis:
      position_scale: 0.25   # Phase 9: lowered from 0.45 — 2008 is the max-DD culprit
      score_mult: 0.7        # Phase 9: lowered from 0.8
    Sideways:
      position_scale: 0.7
      score_mult: 1.0
  enabled: true
  threshold_aggressiveness:
    Bear: 1.0
    Bull: 1.0
    Cautious: 1.0
    Crisis: 1.0
    Sideways: 1.0
research:
  ic_decay_lags:
  - 1
  - 5
  - 10
  - 20
  # WALK-FORWARD FIX (Warwick/HSBC survey §2.1 + Bailey et al. 2014 on backtest overfitting):
  # 5 windows on 2017-2021 are all bull-market dominated. Need to include GFC and COVID stress.
  # Reduce train_years: 7 + step_years: 1 → 8 windows from 2015-2022 (covers COVID crash 2020).
  # Critical: without crisis OOS windows, model selection only validates on bull conditions →
  # systematic overfitting to bull regime. PRUDEX benchmark (PhD thesis §7.2) requires regime
  # diversity as a mandatory evaluation dimension.
  train_years: 7        # 7y training window → 8 OOS windows (2015-2022), includes COVID + 2018 shock
  test_years: 1         # 1 year OOS test window
  step_years: 1         # slide 1 year per window
  walk_forward_enabled: true
  walk_forward_report_path: output/backtests/walk_forward_validation_report.csv
  walk_forward_train_ratio: 0.7
  walk_forward_train_weights: true
  walk_forward_windows: 8   # 8 windows: 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022
retraining:
  train_start_date: "2007-01-01"   # Train on 2007-2022
  train_end_date: "2022-12-31"    # OOS begins 2023
  accept_if_better_on_windows: 0
  compare_to_last_accepted_mean: false
  enabled: true
  last_accepted_oos_path: output/retraining_last_accepted_oos.json
  log_path: output/live/retrain.log
  min_sharpe_ratio_vs_last_accepted: 0.8
  min_sharpe_ratio_vs_previous: 0.85
  model_type: ml
  output_path: output/learned_weights.json
  release_snapshot_on_success: true
  releases_dir: output/models/releases
  run_hour: 0
  run_minute: 0
  scaler_output_path: output/learned_weights_scaler.json
  schedule: monthly
  skip_if_trained_within_days: 0
  train_window_years: 16
  validate_with_backtest: true
  validation_backtest_days: 380
  validation_holdout_calendar_days: 252
  validation_walk_forward_windows: 6   # Raised from 3: HSBC survey says 3 is insufficient for OOS validation
risk:
  bear_gross_cap_fraction: 0.5    # Phase 9: lowered from 0.7
  crisis_gross_cap_fraction: 0.3  # Phase 13: lowered from 0.4 — tighter crisis gross cap to break <20% DD
  regime_short_suppression: true  # Suppress shorts in Crisis (fully) and Bear (capped at bear_short_cap)
  bear_short_cap: 0.5             # In Bear, allow shorts up to 50% of max_weight (vs 100% in Bull/Sideways)
  # Bear: entry gate replaces forced liquidation — no new longs, existing positions exit via signal
  bear_liquidate_longs_on_regime_entry: false  # ARCH: removed — was selling at panic prices on day 1 of Bear
  bear_max_carry_days: 3        # cap planned exits for pre-Bear longs so they don't drag into Bear trend
  bear_max_holding_days: 0
  bear_regime_intraday_exit_drawdown_pct: 0.0   # Disabled: 2% trigger fires within days in bear → re-enter loop → 982% turnover
  bear_signal_quantile: 0.5
  bear_signal_window_days: 60
  bear_skip_new_entries: false  # Disabled: XGBRegressor IC=0.054 in 2022 bear — signal works; blocking kills breadth and 2022 returns entirely
  crisis_accelerated_mtm_at_open: false
  crisis_block_all_new_entries: true  # ARCH: entry gate replaces crisis_transition_loser forced closes
  crisis_first_day_winner_mtm_at_open: false
  crisis_signal_quantile: 0.85
  crisis_signal_window_days: 60
  crisis_transition_accel_enabled: true
  crisis_transition_flatten_all: false
  crisis_transition_force_close_losers_same_day: false  # ARCH: removed — was causing 57% Gross/Net gap
  crisis_transition_loser_max_hold_days: 0
  crisis_transition_use_open_exit: true
  crisis_transition_winner_extra_days: 3  # winners get 3 extra days before being capped
  drawdown_resume_pct: 0.0
  kelly_avg_loss_return: 0.015
  kelly_avg_win_return: 0.02
  kelly_fraction: 0.5
  kelly_win_rate: 0.55
  max_drawdown_pct: 0.0
  max_gross_exposure: 1.5
  max_net_exposure: 0.1
  # VOL-TARGET FIX: actual portfolio vol = 6.5% but target = 10%.
  # Root cause: 12 positions at 8% = 96% gross, but correlation discount + gross cap = ~50% effective.
  # Raise per-position cap 8%→10%; with 18 positions at lower correlation, portfolio vol approaches target.
  # HKUST survey: proper portfolio construction requires vol-targeting to avoid return drag.
  max_position_pct_of_equity: 0.10
  max_short_single_name: 0.08       # Phase 4: match long cap
  min_holding_early_exit_drawdown_pct: 1.0
  position_sizing: signal_strength  # Phase 4: upgraded from equal — size by conviction
  short_borrow_cost_bps: 50
  stop_loss_pct: 0.0
  take_profit_pct: 0.0
  # ATR-scaled stop (Citadel/AQR standard). λ=2.5 means the stop fires when
  # intraday low drops 2.5× ATR(14d) below entry — genuine adverse move, not noise.
  # Set to 0.0 to disable. Recommended: start at 3.0 and tighten to 2.5 if 2008 DD improves.
  atr_stop_lambda: 2.5
  # Signal-flip exit: close position when model score inverts past this threshold.
  # 0.0 = disabled. Set to 0.3 to enable; higher = less sensitive to transient reversals.
  signal_flip_threshold: 0.0
  sharpe_circuit_breaker:               # D3: rolling Sharpe CB — soft exposure reducer
    enabled: true
    window_days: 120
    threshold: -1.5         # Raised from 0.0: only trigger on genuine blowups, not normal market noise
    recovery_threshold: -0.5  # Deactivate once performance recovers above -0.5
    exposure_scale: 0.5     # multiply gross_cap_fraction by 0.5 when active
  var_check:
    check_target: false
    confidence: 0.95
    enabled: true
    lookback_days: 60
    max_var_pct: 0.05
    method: historical
    min_weight_coverage: 0.002
    strict_coverage: false
  vix_deleveraging:
    enabled: true              # Phase 5: enabled — reduces drawdown during VIX spikes
    high_vix_threshold: 35.0   # Raised from 25: at 25 fires 21% of days (813/3796); at 35 only true crisis (~5%)
    scaling_factor: 0.35       # Only applies during genuine stress (VIX>35 = GFC, COVID crash, etc.)
    short_conviction_multiplier: 1.5
    short_ma_exit_enabled: true
    short_stop_loss_pct: 0.03
    short_trend_filter_ma: 200
  vol_lookback_days: 20
  vol_target_annual: 0.10   # Phase 9: lowered from 0.12 — tighter vol target to reduce DD
risk_factors:
  beta_cache_path: output/beta_cache.csv
  beta_lookback_days: 60
  compute_beta_on_fly: false
  liquidity:
    adv_cache_path: output/adv_cache.csv
    adv_lookback_days: 20
    enabled: true
    max_adv_pct: 0.05
    refresh_cache_on_run: false
  max_beta: 1.25
  max_sector_exposure: 0.3
  max_single_name_pct: 0.12
  sector_mapping_path: config/sector_mapping.csv
sectors:
  adjustment_enabled: false
  enabled: false
  max_exposure: 0.3
  momentum_weight: 0.1
  sentiment_weight: 0.1
  volatility_weight: -0.05
signals:
  base_signal_threshold: 0.001
  crisis_block_all_new_entries: false  # must match risk.crisis_block_all_new_entries — was orphaned true (unused)
  dynamic_thresholds_enabled: false
  ensemble:
    clip: false
    models:
    - path: output/models/ridge.pkl
      type: regressor
      weight: 0.40        # Ridge: IC=0.070, Sharpe=1.914 (selected)
    - path: output/models/xgbregressor.pkl
      type: regressor
      weight: 0.60        # XGBRegressor: IC=0.087, Sharpe=2.650 (top pick)
    normalize: true
    standardize: true
  flip_threshold: 0.001
  learned_weights_path: output/learned_weights.json
  min_signal_strength: 0.001
  ml_clip: false
  ml_long_model_path: output/models/best_long_model.pkl
  ml_long_weight: 1.0
  ml_short_allowed_regimes: ["Bear", "Cautious", "Sideways"]   # Papers: Bear is BEST (RRLP: Bear WR=59.7%). Crisis excluded: liquidity collapses making execution impossible (JLST §3).
  ml_short_holding_period_days: 21  # Monthly rebalance per all three papers (Medhat-Schmeling: hold 1 month, RRLP: monthly)
  ml_short_max_squeeze_vol_ratio: 2.2
  ml_short_min_liquidity_usd: 20000000.0
  ml_short_min_signal_strength: 0.55  # lowered: model trained on cross-sectional bottom decile scores differently
  ml_short_model_path: output/models/best_short_model.pkl
  ml_short_overextension_threshold: 0.05
  ml_short_snap_profit_pct: 0.05   # D2: snap profit at 5% decline
  ml_short_position_scale: 0.7    # D2: short book sized at 70% of long equivalent
  ml_short_stop_loss_pct: 0.15     # 15%: papers hold without stop; we add hard risk mgmt for extreme squeezes
  ml_short_weight: 0.5
  ml_standardize: false
  ml_regime_models_dir: output/models   # C2: enable regime-conditional routing (bull/bear/highvol/normal PKLs)
  # Soft-mixture regime blending. Requires running: python run_model_selection.py --regime-models
  # When true, long_score = Σ_r weight(regime_t, r) × f_r(features_t) per _REGIME_BLEND_WEIGHTS.
  # Disabled by default until per-regime regressors are trained.
  ml_regime_blend_enabled: false
  mode: ml
  score_direction: 1.0
  signal_confidence_multiplier: 0.3          # Phase 8: recalibrated for new regressor score scale (std=0.006)
  signal_confidence_multiplier_bear: 0.3     # Raised from 0.2: Bear WR=59.7% is best regime — don't penalise it
  signal_confidence_multiplier_bull: 0.3
  signal_confidence_multiplier_crisis: 0.2   # Still reduced in Crisis (WR=39.4%, n=33)
  signal_confidence_multiplier_sideways: 0.3 # Raised from 0.2: Sideways WR=56.0% is solid
  weights:
    global_news: 0.4
    regional_news: 0.5
    social: 0.3
    trend: 1.0
simulation:
  gbm_enabled: false
slippage_tracking:
  alert_threshold_bps: 10
  enabled: true
  pending_trades_file: output/live/trades_pending.csv
  rolling_trades: 20
  signal_price_source: close
  slippage_metrics_csv: output/live/slippage_metrics.csv
  trades_file: output/live/trades.csv

# Pillar 29: Institutional Dynamic Universe
universe:
  # mode options:
  #   "wrds"   — point-in-time S&P 500 from crsp.dsp500list (requires WRDS_USERNAME)
  #              Filters: price ≥ min_price, dollar_vol ≥ min_dollar_vol, excludes delistings
  #   "sp500"  — current Wikipedia constituents (survivorship bias — research only)
  #   "file"   — load from file_path
  #   "custom" — use tickers list in config
  mode: "wrds"           # switch to "wrds" once WRDS cache is populated (Phase 7)
  cache_path: "config/sp500_tickers.txt"
  cache_max_age_days: 7
  min_price: 10.0
  min_dollar_vol: 1.0e8   # $100M daily dollar volume minimum
  max_tickers: 500
  exclude:
    - "SPY"
    - "XYZ"
    - "BF-B"
    - "BRK-B"  # class B has liquidity issues in some periods
